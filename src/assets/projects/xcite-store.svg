<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="xcite-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
    <radialGradient id="xcite-blue-glow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="xcite-amber-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="xcite-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#xcite-bg)" rx="16" />
  <rect width="800" height="500" fill="url(#xcite-blue-glow)" rx="16" />
  <rect width="800" height="500" fill="url(#xcite-amber-glow)" rx="16" />

  <rect x="30" y="24" width="740" height="452" rx="12" fill="#0c1427" stroke="#1e293b" stroke-width="1.5" filter="url(#xcite-shadow)" />

  <!-- App Header -->
  <g id="header">
    <rect x="30" y="24" width="740" height="52" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="56" cy="50" r="6" fill="#ef4444" />
    <circle cx="76" cy="50" r="6" fill="#f59e0b" />
    <circle cx="96" cy="50" r="6" fill="#10b981" />

    <text x="124" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
      X-Cite Storefront <tspan fill="#60a5fa">• React + Redux + Firebase</tspan>
    </text>

    <!-- Search bar -->
    <g transform="translate(420, 37)">
      <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="28" y="17" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Search products...</text>
      <circle cx="16" cy="13" r="4" fill="none" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="19" y1="16" x2="22" y2="19" stroke="#94a3b8" stroke-width="1.2" />
    </g>

    <!-- Cart Counter -->
    <g transform="translate(650, 37)">
      <rect width="100" height="26" rx="13" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
      <text x="50" y="17" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        Cart (3 items)
      </text>
    </g>
  </g>

  <!-- Product Grid (Left) -->
  <g id="catalog" transform="translate(50, 96)">
    <text x="0" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FEATURED ELECTRONICS</text>

    <!-- Product 1 -->
    <g transform="translate(0, 30)">
      <rect width="150" height="210" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="12" width="126" height="84" rx="6" fill="#172554" />
      <circle cx="75" cy="54" r="22" fill="#2563eb" fill-opacity="0.4" />
      <text x="75" y="60" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">⚡</text>
      <text x="12" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ultra Laptop M3</text>
      <text x="12" y="134" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">512GB SSD • 16GB</text>
      <text x="12" y="156" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$1,299</text>
      <rect x="12" y="168" width="126" height="26" rx="6" fill="#2563eb" />
      <text x="75" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(165, 30)">
      <rect width="150" height="210" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="12" width="126" height="84" rx="6" fill="#172554" />
      <circle cx="75" cy="54" r="22" fill="#8b5cf6" fill-opacity="0.4" />
      <text x="75" y="60" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">🎧</text>
      <text x="12" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Wireless ANC Pro</text>
      <text x="12" y="134" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Spatial Audio • 40h</text>
      <text x="12" y="156" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$299</text>
      <rect x="12" y="168" width="126" height="26" rx="6" fill="#2563eb" />
      <text x="75" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(330, 30)">
      <rect width="150" height="210" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="12" width="126" height="84" rx="6" fill="#172554" />
      <circle cx="75" cy="54" r="22" fill="#10b981" fill-opacity="0.4" />
      <text x="75" y="60" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">📱</text>
      <text x="12" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OLED Smart 5G</text>
      <text x="12" y="134" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">120Hz Display • 256GB</text>
      <text x="12" y="156" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$799</text>
      <rect x="12" y="168" width="126" height="26" rx="6" fill="#2563eb" />
      <text x="75" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Persistent Storage Status Bar -->
    <g transform="translate(0, 260)">
      <rect width="480" height="90" rx="8" fill="#0d182e" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STATE ARCHITECTURE</text>
      <text x="14" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
        • Redux store synced to localStorage for session persistence
      </text>
      <text x="14" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
        • Firebase Auth &amp; Firestore backend integration
      </text>
      <text x="14" y="80" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">
        ✓ Real-time stock calculation &amp; favorites list
      </text>
    </g>
  </g>

  <!-- Right: Cart & Firebase Drawer -->
  <g id="cart-drawer" transform="translate(555, 96)">
    <rect width="190" height="354" rx="10" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHOPPING CART</text>

    <!-- Cart Item 1 -->
    <g transform="translate(12, 38)">
      <rect width="166" height="52" rx="6" fill="#131e36" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ultra Laptop M3</text>
      <text x="10" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$1,299 × 1</text>
      <text x="150" y="24" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(12, 98)">
      <rect width="166" height="52" rx="6" fill="#131e36" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Wireless ANC Pro</text>
      <text x="10" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$299 × 2</text>
      <text x="150" y="24" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- Total -->
    <g transform="translate(12, 170)">
      <line x1="0" y1="0" x2="166" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Subtotal:</text>
      <text x="166" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">$1,897</text>
      <text x="0" y="42" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Shipping: Free</text>
    </g>

    <!-- Checkout Button -->
    <g transform="translate(12, 230)">
      <rect width="166" height="36" rx="8" fill="#2563eb" />
      <text x="83" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Checkout</text>
    </g>

    <!-- Firebase Auth Status -->
    <g transform="translate(12, 280)">
      <rect width="166" height="54" rx="6" fill="#172554" stroke="#1d4ed8" stroke-width="0.8" />
      <text x="8" y="18" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Firebase Auth</text>
      <text x="8" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9">Logged in as Ahmed</text>
      <text x="8" y="46" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">● Session Active</text>
    </g>
  </g>
</svg>
