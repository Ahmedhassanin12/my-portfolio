<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e10" />
      <stop offset="50%" stop-color="#081b1e" />
      <stop offset="100%" stop-color="#061217" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-teal" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-pattern-3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#134e4a" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="panel-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" fill="url(#bg-grad-3)" rx="16" />
  <rect width="800" height="560" fill="url(#grid-pattern-3)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-emerald)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-teal)" rx="16" />

  <!-- Outer Window Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="#08191c" fill-opacity="0.8" stroke="#134e4a" stroke-width="1.5" />

  <!-- Window Header -->
  <g id="window-header">
    <rect x="24" y="24" width="752" height="46" rx="12" fill="#092226" stroke="#134e4a" stroke-width="1.5" />
    <circle cx="48" cy="47" r="6" fill="#ef4444" />
    <circle cx="68" cy="47" r="6" fill="#f59e0b" />
    <circle cx="88" cy="47" r="6" fill="#10b981" />

    <text x="116" y="52" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      design-system / <tspan fill="#34d399">tokens-and-platforms.fig</tspan>
    </text>

    <!-- Multi-Viewport Badge -->
    <g transform="translate(610, 36)">
      <rect width="146" height="22" rx="11" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#6ee7b7" />
      <text x="24" y="15" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        Responsive 320–1920
      </text>
    </g>
  </g>

  <!-- Left: Design Tokens Palette -->
  <g id="tokens-palette" transform="translate(56, 94)">
    <rect width="210" height="412" rx="10" fill="#071b1e" stroke="#134e4a" stroke-width="1" filter="url(#panel-shadow)" />
    <text x="16" y="28" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DESIGN TOKENS</text>

    <!-- Color Swatches -->
    <g transform="translate(16, 44)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PALETTE SCALES</text>
      
      <circle cx="12" cy="18" r="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="40" cy="18" r="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="68" cy="18" r="10" fill="#6366f1" />
      <circle cx="96" cy="18" r="10" fill="#38bdf8" />
      <circle cx="124" cy="18" r="10" fill="#10b981" />
      <circle cx="152" cy="18" r="10" fill="#f59e0b" />
    </g>

    <!-- Component Primitives -->
    <g transform="translate(16, 100)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">UI PRIMITIVES (Shadcn/MUI)</text>

      <!-- Primary Button -->
      <g transform="translate(0, 14)">
        <rect width="176" height="34" rx="8" fill="#10b981" />
        <text x="88" y="21" fill="#042f2e" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Primary Action</text>
      </g>

      <!-- Secondary Ghost Button -->
      <g transform="translate(0, 56)">
        <rect width="176" height="34" rx="8" fill="none" stroke="#2dd4bf" stroke-width="1.5" />
        <text x="88" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ghost Button</text>
      </g>

      <!-- Toggle Switch & Badge -->
      <g transform="translate(0, 98)">
        <rect width="46" height="24" rx="12" fill="#0f766e" />
        <circle cx="34" cy="12" r="9" fill="#ffffff" />

        <rect x="60" y="2" width="116" height="20" rx="6" fill="#134e4a" />
        <text x="118" y="16" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Radius: var(--radius-md)</text>
      </g>

      <!-- Typography Specimen -->
      <g transform="translate(0, 146)">
        <text x="0" y="14" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Display Bold 32px</text>
        <text x="0" y="34" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11">Body Regular 16px / 1.6</text>
        <text x="0" y="52" fill="#5eead4" font-family="'Fira Code', monospace" font-size="10">Mono Label 12px</text>
      </g>

      <!-- Spacing Scale -->
      <g transform="translate(0, 220)">
        <rect width="24" height="6" fill="#10b981" />
        <rect x="30" y="0" width="36" height="6" fill="#14b8a6" />
        <rect x="72" y="0" width="48" height="6" fill="#2dd4bf" />
        <rect x="126" y="0" width="50" height="6" fill="#5eead4" />
      </g>
    </g>
  </g>

  <!-- Right: Real Estate & E-Commerce Platform Preview (From CV) -->
  <g id="platform-preview" transform="translate(290, 94)">
    <rect width="456" height="412" rx="10" fill="#0a1820" stroke="#134e4a" stroke-width="1" filter="url(#panel-shadow)" />

    <!-- Platform Top Bar -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
        Real Estate &amp; E-Commerce Platform
      </text>
      <text x="0" y="32" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11">
        Google Maps API • 10+ Filters • Cross-device responsiveness
      </text>
    </g>

    <!-- Simulated Google Maps + Property Listing Area -->
    <g transform="translate(16, 60)">
      <!-- Map Container -->
      <rect width="424" height="180" rx="8" fill="#091f24" stroke="#134e4a" stroke-width="1" />
      
      <!-- Simulated Map Roads / Grid -->
      <path d="M 0 60 Q 120 40 220 80 T 424 70" fill="none" stroke="#134e4a" stroke-width="6" />
      <path d="M 140 0 L 150 180" fill="none" stroke="#134e4a" stroke-width="5" />
      <path d="M 310 0 L 290 180" fill="none" stroke="#134e4a" stroke-width="5" />
      <path d="M 0 140 L 424 130" fill="none" stroke="#134e4a" stroke-width="4" />

      <!-- Map Pin 1 with price card -->
      <g transform="translate(140, 48)">
        <circle cx="12" cy="12" r="10" fill="#10b981" />
        <path d="M 7 12 L 12 18 L 17 12 Z" fill="#10b981" />
        <rect x="26" y="2" width="76" height="22" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1" />
        <text x="64" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">$420,000</text>
      </g>

      <!-- Map Pin 2 with price card -->
      <g transform="translate(260, 90)">
        <circle cx="12" cy="12" r="10" fill="#38bdf8" />
        <path d="M 7 12 L 12 18 L 17 12 Z" fill="#38bdf8" />
        <rect x="26" y="2" width="76" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
        <text x="64" y="16" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">$650,000</text>
      </g>

      <!-- Map Badge -->
      <g transform="translate(12, 12)">
        <rect width="110" height="20" rx="4" fill="#042f2e" stroke="#14b8a6" stroke-width="0.8" />
        <text x="8" y="14" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Google Maps Live</text>
      </g>
    </g>

    <!-- Property Cards Grid Below Map -->
    <g transform="translate(16, 256)">
      <!-- Property Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="204" height="128" rx="8" fill="#081e22" stroke="#134e4a" stroke-width="1" />
        <rect x="10" y="10" width="184" height="60" rx="4" fill="#0e2a30" />
        <text x="14" y="26" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="9" font-weight="700">FEATURED</text>
        <text x="12" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Seaside Residence</text>
        <text x="12" y="102" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10">Alexandria, Egypt</text>
        <text x="12" y="118" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$420,000</text>
      </g>

      <!-- Property Card 2 -->
      <g transform="translate(220, 0)">
        <rect width="204" height="128" rx="8" fill="#081e22" stroke="#134e4a" stroke-width="1" />
        <rect x="10" y="10" width="184" height="60" rx="4" fill="#0e2a30" />
        <text x="14" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">VERIFIED AGENT</text>
        <text x="12" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Modern Villa</text>
        <text x="12" y="102" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10">Cairo, Egypt</text>
        <text x="12" y="118" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$650,000</text>
      </g>
    </g>
  </g>
</svg>
