<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow-react" cx="25%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-tanstack" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-pattern-2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" fill="url(#bg-grad-2)" rx="16" />
  <rect width="800" height="560" fill="url(#grid-pattern-2)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-react)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-tanstack)" rx="16" />

  <!-- Outer Window Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="#090e1d" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <g id="window-header">
    <rect x="24" y="24" width="752" height="46" rx="12" fill="#0c1427" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="48" cy="47" r="6" fill="#ef4444" />
    <circle cx="68" cy="47" r="6" fill="#f59e0b" />
    <circle cx="88" cy="47" r="6" fill="#10b981" />

    <text x="116" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      architecture / <tspan fill="#38bdf8">next-tanstack-pipeline.ts</tspan>
    </text>

    <!-- Speed / Performance Pill -->
    <g transform="translate(630, 36)">
      <rect width="126" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#34d399" />
      <text x="24" y="15" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        Lighthouse 100
      </text>
    </g>
  </g>

  <!-- Left: Server / SSR Edge Node (Next.js) -->
  <g id="server-edge" transform="translate(60, 110)">
    <rect width="210" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#node-shadow)" />
    
    <!-- Top badge -->
    <rect x="16" y="16" width="94" height="22" rx="6" fill="#000000" stroke="#475569" stroke-width="1" />
    <text x="24" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Next.js RSC</text>
    <text x="16" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Server Side Node</text>
    <text x="16" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Hydration &amp; Data Stream</text>

    <!-- Code Preview Card -->
    <g transform="translate(14, 104)">
      <rect width="182" height="150" rx="8" fill="#070b14" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">async function Page()</text>
      <text x="12" y="44" fill="#64748b" font-family="'Fira Code', monospace" font-size="10">// Server Pre-fetch</text>
      <text x="12" y="64" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="10">const data = await</text>
      <text x="12" y="82" fill="#10b981" font-family="'Fira Code', monospace" font-size="10">queryClient.prefetch(</text>
      <text x="20" y="100" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10">["properties", id]</text>
      <text x="12" y="118" fill="#10b981" font-family="'Fira Code', monospace" font-size="10">)</text>
      <text x="12" y="136" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">return &lt;Hydrate /&gt;</text>
    </g>

    <!-- Edge Server Metrics -->
    <g transform="translate(14, 274)">
      <rect width="182" height="88" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">EDGE METRICS</text>
      <text x="14" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TTFB: 32ms</text>
      <text x="14" y="66" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SSR Compression: gzip</text>
    </g>
  </g>

  <!-- Middle: Data Flow Arrows & Query Cache -->
  <g id="data-pipeline" transform="translate(270, 220)">
    <!-- Connecting animated dash lines -->
    <path d="M 10 30 L 70 30" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
    <path d="M 70 30 L 60 22 M 70 30 L 60 38" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- TanStack Query Cache Hub -->
    <g transform="translate(74, -50)">
      <rect width="170" height="160" rx="12" fill="#181329" stroke="#f97316" stroke-width="1.5" filter="url(#node-shadow)" />
      <rect x="14" y="14" width="102" height="20" rx="5" fill="#431407" stroke="#ea580c" stroke-width="1" />
      <text x="20" y="28" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10" font-weight="700">TanStack Query</text>

      <text x="14" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Query Cache</text>
      <text x="14" y="74" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10">staleTime: 5 * 60 * 1000</text>

      <!-- Status pills -->
      <g transform="translate(14, 90)">
        <rect width="142" height="24" rx="6" fill="#2e1065" />
        <circle cx="12" cy="12" r="3" fill="#a855f7" />
        <text x="22" y="16" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Optimistic Update</text>
      </g>
      <g transform="translate(14, 122)">
        <rect width="142" height="24" rx="6" fill="#042f2e" />
        <circle cx="12" cy="12" r="3" fill="#14b8a6" />
        <text x="22" y="16" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Background Refetch</text>
      </g>
    </g>

    <!-- Second arrow towards Client -->
    <path d="M 254 30 L 314 30" stroke="#f97316" stroke-width="3" stroke-dasharray="6,4" />
    <path d="M 314 30 L 304 22 M 314 30 L 304 38" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Right: Client React & TypeScript Ecosystem -->
  <g id="client-react" transform="translate(530, 110)">
    <rect width="210" height="380" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#node-shadow)" />

    <!-- Top badge -->
    <rect x="16" y="16" width="94" height="22" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <text x="24" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">React Client</text>
    <text x="16" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">UI State Store</text>
    <text x="16" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Redux Toolkit / Zustand</text>

    <!-- TypeScript Interface Box -->
    <g transform="translate(14, 104)">
      <rect width="182" height="150" rx="8" fill="#070b14" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#818cf8" font-family="'Fira Code', monospace" font-size="11">interface State {</text>
      <text x="20" y="44" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">user: AuthUser;</text>
      <text x="20" y="64" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">kanban: Board;</text>
      <text x="20" y="84" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">theme: 'dark';</text>
      <text x="20" y="104" fill="#10b981" font-family="'Fira Code', monospace" font-size="10">syncStatus: 'ok';</text>
      <text x="12" y="124" fill="#818cf8" font-family="'Fira Code', monospace" font-size="11">}</text>
    </g>

    <!-- State & Hook Execution -->
    <g transform="translate(14, 274)">
      <rect width="182" height="88" rx="8" fill="#0c192c" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STATE HARNESS</text>
      <text x="14" y="46" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">useZustandStore()</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero re-render memo</text>
    </g>
  </g>
</svg>
