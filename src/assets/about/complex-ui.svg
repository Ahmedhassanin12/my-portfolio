<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow-indigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern-1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="active-drag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="560" fill="url(#bg-grad-1)" rx="16" />
  <rect width="800" height="560" fill="url(#grid-pattern-1)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-indigo)" rx="16" />
  <rect width="800" height="560" fill="url(#glow-cyan)" rx="16" />

  <!-- Outer Window Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <g id="window-header">
    <rect x="24" y="24" width="752" height="46" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="48" cy="47" r="6" fill="#ef4444" />
    <circle cx="68" cy="47" r="6" fill="#f59e0b" />
    <circle cx="88" cy="47" r="6" fill="#10b981" />

    <!-- Breadcrumb / System Title -->
    <text x="116" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      workspace / <tspan fill="#e2e8f0">kanban-module.tsx</tspan>
    </text>

    <!-- Real-time Status Badge -->
    <g transform="translate(620, 36)">
      <rect width="136" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="15" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
        Live Sync Active
      </text>
    </g>
  </g>

  <!-- Left: Kanban Board Module -->
  <g id="kanban-board" transform="translate(48, 90)">
    <!-- Column 1: Backlog / To Do -->
    <g id="col-todo">
      <rect x="0" y="0" width="180" height="420" rx="10" fill="#0c1427" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">TO DO</text>
      <circle cx="160" cy="22" r="9" fill="#1e293b" />
      <text x="160" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">2</text>

      <!-- Card 1 -->
      <g transform="translate(12, 42)" filter="url(#card-shadow)">
        <rect width="156" height="74" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="12" width="48" height="6" rx="3" fill="#6366f1" />
        <text x="12" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API Contract Sync</text>
        <text x="12" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">REST &amp; Schema</text>
        <circle cx="140" cy="56" r="8" fill="#3b82f6" />
        <text x="140" y="59" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">A</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(12, 128)" filter="url(#card-shadow)">
        <rect width="156" height="74" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="12" width="36" height="6" rx="3" fill="#10b981" />
        <text x="12" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Audit Accessibility</text>
        <text x="12" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">WCAG 2.1 AA</text>
      </g>
    </g>

    <!-- Column 2: In Progress (Features Active Drag & Drop) -->
    <g id="col-progress" transform="translate(196, 0)">
      <rect x="0" y="0" width="180" height="420" rx="10" fill="#0e172e" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">IN PROGRESS</text>
      <circle cx="160" cy="22" r="9" fill="#1e3a5f" />
      <text x="160" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">3</text>

      <!-- Drop Target Outline (dnd-kit placeholder) -->
      <g transform="translate(12, 42)">
        <rect width="156" height="84" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#6366f1" stroke-dasharray="4,4" stroke-width="1.5" />
        <text x="78" y="47" fill="#6366f1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
          Drop Target Active
        </text>
      </g>

      <!-- Stable card in progress -->
      <g transform="translate(12, 138)" filter="url(#card-shadow)">
        <rect width="156" height="74" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="12" width="56" height="6" rx="3" fill="#f59e0b" />
        <text x="12" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Maps Geo Search</text>
        <text x="12" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">10+ Filter criteria</text>
      </g>

      <!-- Another card in progress -->
      <g transform="translate(12, 224)" filter="url(#card-shadow)">
        <rect width="156" height="74" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="12" width="44" height="6" rx="3" fill="#ec4899" />
        <text x="12" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Virtualizer Grid</text>
        <text x="12" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">60 FPS Scroll</text>
      </g>
    </g>

    <!-- Column 3: Completed / Done -->
    <g id="col-done" transform="translate(392, 0)">
      <rect x="0" y="0" width="180" height="420" rx="10" fill="#0c1427" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">COMPLETED</text>
      <circle cx="160" cy="22" r="9" fill="#064e3b" />
      <text x="160" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">5</text>

      <g transform="translate(12, 42)" filter="url(#card-shadow)">
        <rect width="156" height="74" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1" />
        <rect x="12" y="12" width="40" height="6" rx="3" fill="#10b981" />
        <text x="12" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Real-Time Chat</text>
        <text x="12" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Channels &amp; DMs</text>
        <path d="M 132 54 L 138 60 L 148 48" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Floating / Dragged Card (dnd-kit Active Drag Overlay) -->
    <g transform="translate(186, 70) rotate(-3)" filter="url(#active-drag-shadow)">
      <rect width="176" height="96" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <rect x="14" y="14" width="56" height="7" rx="3" fill="#818cf8" />
      <text x="14" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">dnd-kit Kanban</text>
      <text x="14" y="60" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Drag-and-drop cards</text>
      <rect x="14" y="72" width="62" height="16" rx="4" fill="#312e81" />
      <text x="45" y="83" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">dragging</text>
      <circle cx="154" cy="80" r="10" fill="#4338ca" />
      <text x="154" y="84" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">AI</text>
    </g>
  </g>

  <!-- Right: Real-time Communication Drawer (Slack-style chat from CV) -->
  <g id="chat-stream" transform="translate(628, 90)">
    <rect width="124" height="420" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CHANNELS</text>
    
    <!-- Channel items -->
    <text x="14" y="52" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600"># general</text>
    <text x="14" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="11"># dev-realtime</text>
    <text x="14" y="96" fill="#64748b" font-family="system-ui, sans-serif" font-size="11"># deployment</text>

    <!-- Message Bubble -->
    <g transform="translate(10, 130)">
      <rect width="104" height="54" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="8" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Ahmed Ibrahim</text>
      <text x="8" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Channel live syncd</text>
      <text x="8" y="44" fill="#10b981" font-family="system-ui, sans-serif" font-size="8">✓ 0ms latency</text>
    </g>
    
    <g transform="translate(10, 196)">
      <rect width="104" height="54" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="8" y="18" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Nweave Bot</text>
      <text x="8" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">PR #42 approved</text>
      <text x="8" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">2m ago</text>
    </g>
  </g>
</svg>
